name: Portable contracts
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test portable contracts
        run: python scripts/run_portable_tests.py
      - name: Build and verify source package
        run: python scripts/build_package.py --label ci
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.python }}
          path: dist/ART-CLI-0.2.0-ci.zip*
